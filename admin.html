<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QPUC — Admin</title>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body>

<h1>Admin</h1>
<div id="app-view"></div>

</body>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.store('app', {
            game: null,
            buzzers: [],
            players: [
                { name: '', buzzer_id: '' },
                { name: '', buzzer_id: '' },
                { name: '', buzzer_id: '' },
                { name: '', buzzer_id: '' },
            ],
            themes: ['', '', '', ''],
        });
    });

    // -------------------------

    const CLIENT_ID_KEY = 'qpuc_admin_client_id';
    let clientId = localStorage.getItem(CLIENT_ID_KEY);
    let ws = null;

    const PHASE_SETUP = "Setup"
    const PHASE_NPG = "9 point gagnants"
    const PHASE_QALS = "4 à la suite"
    const PHASE_TIEBREAK = "Tiebreak"
    const PHASE_FAF = "Face à face"

    const VIEW_PATH = "views/admin/";

    const VIEW_FILES = {
        [PHASE_SETUP]:    VIEW_PATH + 'setup.html',
        [PHASE_NPG]:      VIEW_PATH + 'npg.html',
        [PHASE_QALS]:     VIEW_PATH + 'qals.html',
        [PHASE_FAF]:      VIEW_PATH + 'faf.html',
        [PHASE_TIEBREAK]: VIEW_PATH + 'tiebreak.html',
    };

    // -------------------------

    function send_ws(obj) {
        if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify(obj));
        }
    }

    function connect() {
        ws = new WebSocket(`ws://${location.hostname}:8765/web`);
        ws.onopen = () => {
            localStorage.setItem(CLIENT_ID_KEY, clientId);
            send_ws({ type: 'hello', client_session_id: clientId });
            send_esp_list_rq();
        };
        ws.onclose = () => setTimeout(connect, 3000);
        ws.onmessage = e => {
            console.log('ws.onmessage', e.data);
            const d = JSON.parse(e.data);

            if (d.type === 'state' && d.game && d.game.phase) {
                Alpine.store('app').game = d.game;
                Alpine.store('app').players = [
                    { name: '', buzzer_id: '' },
                    { name: '', buzzer_id: '' },
                    { name: '', buzzer_id: '' },
                    { name: '', buzzer_id: '' },
                ]
                for(const player of d.game.players) {
                    if(!Alpine.store('app').players.some(p => p.name === player.name && p.buzzer_id === player.buzzer_id)) {
                        Alpine.store('app').players.push({ name: player.name, buzzer_id: player.buzzer_id });
                    }
                }
                render();
            }
            else if (d.type === "esp_list_rs") {
                console.log("ESP list received:", d.buzzer_sessions);
                Alpine.store('app').buzzers = d.buzzer_sessions || [];
            }
        };
    }

    connect();

    // -------------------------

    let currentPhase = null;
    const container = document.getElementById('app-view');

    async function loadView(phase) {
        if (phase === currentPhase) return;   // évite de recharger la même vue
        currentPhase = phase;

        const file = VIEW_FILES[phase];
        if (!file) return;

        const html = await (await fetch(file)).text();

        Alpine.destroyTree(container);   // détruit les watchers/listeners de l'ancienne vue
        container.innerHTML = html;
        Alpine.initTree(container);      // active Alpine sur le nouveau contenu injecté
    }

    function render() {
        const G = Alpine.store('app').game;
        if (!G) return;
        loadView(G.phase);
    }

    // -------------------------

    function send_close_setup() {
        var error = false;
        var errorMessage = "";

        const players = Alpine.store('app').players
            .map(p => ({ name: p.name.trim(), buzzer_id: p.buzzer_id }))
            .filter(p => p.name || p.buzzer_id);
            console.log("players", players);

        const themes = Alpine.store('app').themes.map((theme, index) => ({
            index,
            theme: theme.trim()
        }));
        /*
        if(players.length != 4){
            errorMessage += "Il doit y avoir 4 joueurs afin de commencer la partie.\n";
            error = true;
        }

        for (const player of Alpine.store('app').players) {
            console.log("player", player);
            if (player.name.trim() === "" || player.buzzer_id.trim() === "" ) {
                errorMessage += "Tous les joueurs doivent avoir un nom et un buzzer sélectionné.\n";
                error = true;
            }
            break;
        }

        for (const theme of themes) {
            if (!theme.theme || theme.theme.trim() === "") {
                errorMessage += "Tous les thèmes doivent être remplis.\n";
                error = true;
            }
            break;
        }

        if (error) { 
            alert(errorMessage);
            console.error("send_close_setup error:", errorMessage);
            return;
        }*/

        const command = {
            type: "end_phase",
            players,
            themes
        };

        console.log("setNewPhase", command);
        send_ws(command);
    }

    function send_esp_list_rq() {
        const command = {
            type: 'esp_list_rq',
            client_session_id: clientId
        };

        send_ws(command);
    }

    function activate_buzzers(players) {
        if (!players || players.length === 0) return;

        const command = {
            type: 'activate_buzzers',
            buzzers: players.map(p => p.buzzer_id)
        };

        send_ws(command);
    }

    function deactivate_buzzers(players) {
        if (!players || players.length === 0) return;

        const command = {
            type: 'deactivate_buzzers',
            buzzers: players.map(p => p.buzzer_id)
        };

        send_ws(command);
    }

    function buzzer_ask_to_talk(player) {
        if (!player) return;

        const command = {
            type: 'buzzer_ask_to_talk',
            buzzer_id: player.buzzer_id
        };

        send_ws(command);
    }

    function toggle_question_mode(){
        const command = {
            type: 'toggle_question_mode'
        };

        send_ws(command);
    }

    function points_next_q_manuel(){
        const command = {
            type: 'points_next_q_manuel'
        };

        send_ws(command);
    }

    function correct_answer(player) {
        if (!player) return;

        const command = {
            type: 'correct_answer',
            player_id: player.pid
        };

        send_ws(command);
    }

    function add_manual_points(player, points) {
        if (!player || !points) return;
        const command = {
            type: 'add_manual_points',
            player_id: player.pid,
            points: parseInt(points)
        };

        send_ws(command);
    }

</script>
</html>
